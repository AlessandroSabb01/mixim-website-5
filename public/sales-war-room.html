<header style="top:env(safe-area-inset-top,0px)" class="sticky z-30 border-b border-line bg-ink/80 backdrop-blur-xl">

    <table class="w-full min-w-[1200px] text-sm">

  const q = ui.q.toLowerCase().trim();
  let out = leads.filter(l =>
    (!ui.cat || l.category === ui.cat) && (!ui.temp || l.temp === ui.temp) && (!ui.status || l.status === ui.status) &&
    (!q || [l.name,l.contact,l.hood,l.address,l.notes,l.category,l.instagram,l.email].join(' ').toLowerCase().includes(q)));
  if (ui.sort === 'virality') out.sort((a,b) => a.tier - b.tier || b.score - a.score || a.name.localeCompare(b.name));
  else out.sort((a,b) => a.name.localeCompare(b.name, 'fr'));
  return out;
}

// ---------- Render ----------
function stat(label, value, sub, glow, color) {
  return `<div class="rounded-2xl border border-line ${glow || 'bg-surface'} px-4 py-3">
    <div class="eyebrow">${label}</div>
    <div class="display mt-1.5 text-3xl ${color}">${value}</div>
    <div class="mt-1 text-[12px] text-muted">${sub}</div></div>`;
}
function renderStats(view) {
  const total = leads.length, hot = leads.filter(l => l.temp === 'Hot').length;
  const contacted = leads.filter(l => l.status !== 'To be called').length;
  const today = leads.filter(l => isToday(l.lastContact)).length;
  const conv = leads.filter(l => l.status === 'Meeting booked' || l.status === 'Client').length;
  const rate = contacted ? (conv / contacted * 100).toFixed(1) : '0.0';
  $('stats').innerHTML =
    stat('Total leads', total, `${view.length} dans la vue`, '', 'text-white') +
    stat('Hot leads', hot, `${(hot/total*100||0).toFixed(0)}% du pipeline`, '', 'text-emerald-400') +
    stat("Appels aujourd'hui", today, `${contacted} contactés au total`, '', 'text-white') +
    stat('Taux conversion', rate + '%', `${conv} meetings/clients ÷ contactés`, 'glow-accent', 'text-accent-soft') +
    stat('Clients signés', leads.filter(l => l.status === 'Client').length, 'issus de la prospection', '', 'text-white');
}
const selectHtml = (field, id, opts, cur, cls) =>
  `<select data-inline="${field}" data-id="${id}" class="rounded-full border px-3 py-1 text-xs font-medium outline-none ${cls}">${opts.map(o => `<option ${o===cur?'selected':''} value="${o}">${field==='temp'?TEMP_ICON[o]+' ':''}${o}</option>`).join('')}</select>`;

function render() {
  const view = filtered();
  renderStats(view);
  $('countLbl').textContent = `${view.length} / ${leads.length} leads affichés · tri: ${ui.sort === 'virality' ? 'Virality Ratio' : 'A → Z'}`;
  $('sortToggle').textContent = ui.sort === 'virality' ? '⚡ Ordre Virality: ON' : '⚡ Ordre Virality: OFF';
  $('empty').classList.toggle('hidden', view.length > 0);
  $('tbody').innerHTML = view.map((l, i) => `
    <tr class="row-enter hover:bg-surface/70">
      <td class="px-3 py-2 mono text-xs text-neutral-500">${i + 1}</td>
      <td class="px-3 py-2"><div class="font-semibold text-white">${esc(l.name)}</div><div class="text-xs text-muted">${esc(l.category)}</div></td>
      <td class="px-3 py-2"><div class="flex items-center gap-2"><span class="mono font-bold ${TIER_CLS[l.tier]}">${l.score}</span>
        <div class="h-1 w-14 rounded-full bg-line"><div class="h-1 rounded-full bg-gradient-to-r from-accent to-accent-soft" style="width:${l.score}%"></div></div></div>
        <div class="text-[10px] uppercase tracking-wider text-neutral-500">Tier ${l.tier}</div></td>
      <td class="px-3 py-2"><div class="text-neutral-200">${esc(l.contact)}</div>
        <a href="tel:${esc(l.phone)}" class="mono text-xs text-neutral-300 hover:text-white">${esc(l.phone)}</a><br>
        <a href="mailto:${esc(l.email)}" class="text-xs text-muted hover:text-white">${esc(l.email)}</a></td>
      <td class="px-3 py-2 text-xs leading-5"><a target="_blank" rel="noopener" href="${mapsUrl(l)}" class="text-white hover:underline">Google Maps ↗</a><br>
        ${igUrl(l) ? `<a target="_blank" rel="noopener" href="${esc(igUrl(l))}" class="text-accent-soft hover:underline">${esc(l.instagram)}</a><br>` : ''}
        ${webUrl(l) ? `<a target="_blank" rel="noopener" href="${esc(webUrl(l))}" class="text-muted hover:text-white">Site web ↗</a>` : ''}</td>
      <td class="px-3 py-2 text-xs"><div class="text-neutral-200">${esc(l.hood)}</div><div class="text-neutral-500">${esc(l.address.split(',')[0])}</div></td>
      <td class="px-3 py-2">${selectHtml('status', l.id, STATUSES, l.status, STATUS_CLS[l.status])}</td>
      <td class="px-3 py-2">${selectHtml('temp', l.id, TEMPS, l.temp, TEMP_CLS[l.temp])}</td>
      <td class="px-3 py-2 max-w-[240px]"><div contenteditable="true" data-note="${l.id}" class="rounded px-1 text-xs text-neutral-300 outline-none focus:bg-surface-2 focus:ring-1 focus:ring-accent">${esc(l.notes)}</div></td>
      <td class="px-3 py-2 text-right whitespace-nowrap">
        <button data-edit="${l.id}" class="rounded-full border border-line px-3 py-1 text-xs hover:border-neutral-500 hover:text-white">Éditer</button>
        <button data-del="${l.id}" class="rounded-full border border-line px-3 py-1 text-xs hover:border-rose-500 hover:text-rose-400">✕</button></td>
    </tr>`).join('');
}

// ---------- Mutations ----------
function update(id, patch) {
  const l = leads.find(x => x.id === id); if (!l) return;
  if (patch.status && patch.status !== l.status && patch.status !== 'To be called') patch.lastContact = new Date().toISOString();
  if (patch.status === 'Client' || patch.status === 'Meeting booked') patch.temp = 'Hot';
  if (patch.category) patch.tier = CATS[patch.category].tier;
  Object.assign(l, patch); save(); render();
}

// ---------- Modal ----------
let editing = null;
const FIELDS = [
  ['name','Entreprise','text',true],['category','Catégorie','cat'],['score','Virality score (1-100)','number'],
  ['contact','Contact','text'],['phone','Téléphone','tel'],['email','Courriel','email'],
  ['instagram','Instagram','text'],['website','Site web','url'],['hood','Quartier','text'],['address','Adresse','text'],
  ['status','Statut','status'],['temp','Température','temp'],['notes','Notes d’appel','textarea'],
];
function openModal(lead) {
  editing = lead ? lead.id : null;
  const d = lead || { category:'Food', score:CATS.Food.base, status:'To be called', temp:'Cold', instagram:'', website:'' };
  $('mTitle').textContent = lead ? `Éditer · ${lead.name}` : 'Nouveau lead';
  const inp = 'mt-1 w-full rounded-xl border border-line bg-ink-2 px-4 py-2 text-sm outline-none focus:border-accent';
  const opts = (arr, v) => arr.map(o => `<option ${o===v?'selected':''}>${o}</option>`).join('');
  $('formFields').innerHTML = FIELDS.map(([k, label, type, req]) => {
    let ctl;
    if (type === 'cat') ctl = `<select name="${k}" class="${inp}">${opts(Object.keys(CATS), d[k])}</select>`;
    else if (type === 'status') ctl = `<select name="${k}" class="${inp}">${opts(STATUSES, d[k])}</select>`;
    else if (type === 'temp') ctl = `<select name="${k}" class="${inp}">${opts(TEMPS, d[k])}</select>`;
    else if (type === 'textarea') ctl = `<textarea name="${k}" rows="3" class="${inp}">${esc(d[k])}</textarea>`;
    else ctl = `<input name="${k}" type="${type}" ${type==='number'?'min="1" max="100"':''} ${req?'required':''} value="${esc(d[k])}" class="${inp}">`;
    return `<label class="text-xs text-muted ${type==='textarea'?'sm:col-span-2':''}">${label}${ctl}</label>`;
  }).join('');
  $('modal').classList.replace('hidden','flex');
  $('form').name.focus();
}
const closeModal = () => $('modal').classList.replace('flex','hidden');

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  data.score = Math.max(1, Math.min(100, parseInt(data.score) || CATS[data.category].base));
  data.tier = CATS[data.category].tier;
  if (data.instagram && !/^@|instagram\.com/.test(data.instagram)) data.instagram = '@' + data.instagram;
  if (editing) { update(editing, data); toast('Lead mis à jour'); }
  else {
    const n = Math.max(0, ...leads.map(l => parseInt(l.id.slice(1)) || 0)) + 1;
    leads.unshift({ id:'L' + String(n).padStart(3,'0'), lastContact: data.status !== 'To be called' ? new Date().toISOString() : null, ...data });
    save(); render(); toast('Lead ajouté');
  }
  closeModal();
});
$('exportClose').onclick = () => $('exportDlg').classList.replace('flex','hidden');
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.hasAttribute('data-close')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('exportDlg').classList.replace('flex','hidden'); $('confirm').classList.replace('flex','hidden'); } if (e.key === '/' && document.activeElement.tagName === 'BODY') { e.preventDefault(); $('q').focus(); } });

// ---------- Table events (delegated) ----------
$('tbody').addEventListener('change', e => {
  const el = e.target.closest('[data-inline]'); if (!el) return;
  update(el.dataset.id, { [el.dataset.inline]: el.value }); toast('Enregistré');
});
$('tbody').addEventListener('focusout', e => {
  const el = e.target.closest('[data-note]'); if (!el) return;
  const l = leads.find(x => x.id === el.dataset.note);
  if (l && l.notes !== el.innerText.trim()) { l.notes = el.innerText.trim(); save(); toast('Note enregistrée'); }
});
$('tbody').addEventListener('keydown', e => { if (e.target.dataset.note !== undefined && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.blur(); } });
$('tbody').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if (ed) openModal(leads.find(l => l.id === ed.dataset.edit));
  if (del) { const l = leads.find(x => x.id === del.dataset.del); if (l) askConfirm(`Supprimer « ${l.name} » ?`, () => { leads = leads.filter(x => x !== l); save(); render(); toast('Lead supprimé'); }); }
});

// ---------- Toolbar ----------
const fill = (el, label, arr) => el.innerHTML = `<option value="">${label}</option>` + arr.map(o => `<option>${o}</option>`).join('');
fill($('fCat'), 'Toutes catégories', Object.keys(CATS));
fill($('fTemp'), 'Toutes températures', TEMPS);
fill($('fStatus'), 'Tous statuts', STATUSES);
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { ui.q = e.target.value; render(); }, 80); });
$('fCat').onchange = e => { ui.cat = e.target.value; render(); };
$('fTemp').onchange = e => { ui.temp = e.target.value; render(); };
$('fStatus').onchange = e => { ui.status = e.target.value; render(); };
$('sortToggle').onclick = () => { ui.sort = ui.sort === 'virality' ? 'alpha' : 'virality'; render(); };
$('btnReset').onclick = () => { Object.assign(ui, { q:'', cat:'', temp:'', status:'' }); ['q','fCat','fTemp','fStatus'].forEach(i => $(i).value = ''); render(); };
$('btnAdd').onclick = () => openModal(null);
$('btnSeed').onclick = () => askConfirm('Effacer toutes les modifications et restaurer les 100 leads de départ ?', () => { leads = seed(); save(); render(); toast('Données restaurées'); });
$('btnCsv').onclick = () => {
  const cols = ['id','name','category','tier','score','contact','phone','email','instagram','website','hood','address','status','temp','notes','lastContact'];
  const cell = v => { const t = String(v ?? ''); return /[",\n;]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const rows = filtered(), csv = [cols.join(','), ...rows.map(l => cols.map(c => cell(l[c])).join(','))].join('\r\n');
  $('exportText').value = csv;
  $('exportInfo').textContent = `${rows.length} leads de la vue filtrée actuelle.`;
  $('exportDlg').classList.replace('hidden','flex');
  $('exportDownload').onclick = () => {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' })), download: `warroom-leads-${new Date().toISOString().slice(0,10)}.csv` });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('exportCopy').onclick = () => {
    const ta = $('exportText');
    navigator.clipboard.writeText(csv).then(() => toast('CSV copié'), () => { ta.focus(); ta.select(); toast('Texte sélectionné, faites Ctrl/Cmd+C'); });
  };
};
const tick = () => $('clock').textContent = new Date().toLocaleString('fr-CA', { weekday:'short', hour:'2-digit', minute:'2-digit' });
tick(); setInterval(tick, 30000);

render();
})();
</script>
</body>
</html>
