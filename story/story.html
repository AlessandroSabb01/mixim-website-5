<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    background: #0b0b0f;
    color: #fff;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow1, .glow2 {
    position: absolute; border-radius: 50%; filter: blur(140px);
  }
  .glow1 { width: 760px; height: 760px; background: #ff2e63; top: -220px; right: -260px; opacity: .55; }
  .glow2 { width: 700px; height: 700px; background: #ffb800; bottom: -260px; left: -260px; opacity: .35; }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .wrap {
    position: relative; z-index: 2;
    height: 100%;
    padding: 230px 80px 250px;
    display: flex; flex-direction: column;
  }
  .brand {
    font-weight: 800; font-size: 34px; letter-spacing: 6px; text-transform: uppercase;
    color: #ffb800;
  }
  h1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 200px; line-height: .92; letter-spacing: 2px;
    margin-top: 30px;
    text-shadow: 0 0 40px rgba(255,46,99,.55);
  }
  h1 span { color: #ff2e63; }
  h1 .clap { font-size: 140px; vertical-align: 20px; text-shadow:none; }
  .role {
    display: inline-block; align-self: flex-start;
    margin-top: 40px;
    background: #fff; color: #0b0b0f;
    font-weight: 800; font-size: 46px;
    padding: 18px 34px; border-radius: 14px;
    transform: rotate(-2deg);
  }
  .skills { margin-top: 70px; display: flex; flex-direction: column; gap: 26px; }
  .skill {
    display: flex; align-items: center; gap: 28px;
    background: rgba(255,255,255,.06);
    border: 2px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 24px 32px;
    font-size: 48px; font-weight: 700;
  }
  .skill .e { font-size: 54px; width: 64px; text-align: center; }
  .skill small { font-weight: 500; font-size: 34px; color: #ffb800; margin-left: 6px; }
  .tag {
    margin-top: 50px; font-size: 44px; font-weight: 700; color: rgba(255,255,255,.85);
  }
  .cta {
    margin-top: 50px;
    background: linear-gradient(90deg, #ff2e63, #ff7a00);
    border-radius: 28px;
    padding: 36px 40px;
    font-size: 46px; font-weight: 800; line-height: 1.2;
    box-shadow: 0 20px 60px rgba(255,46,99,.45);
  }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="brand">Création Virale</div>
    <h1>ON <span class="clap">🎬</span><br><span>RECRUTE</span></h1>
    <div class="role">Monteur·se vidéo freelance</div>

    <div class="skills">
      <div class="skill"><span class="e">🎯</span>Motion tracking</div>
      <div class="skill"><span class="e">✨</span>Deep Glow</div>
      <div class="skill"><span class="e">🔊</span>SFX de rétention</div>
      <div class="skill"><span class="e">💬</span><div>Sous-titres animés<br><small>Submagic = bonus</small></div></div>
    </div>

    <div class="tag">⚡ Rapide, créatif·ve, plein·e d'idées</div>

    <div class="cta">👉 Écris-nous en DM avec tes meilleurs montages !</div>
  </div>
</body>
</html>
