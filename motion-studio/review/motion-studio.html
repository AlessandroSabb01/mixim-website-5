<title>Création Virale - Motion Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Création Virale Motion Studio. Layout: a sticky studio bar over three views (Home, Review, Create);
   Review = dark 9:16 stage + beat-ruled timeline on the left, a comment/request rail on the right. */
:root {
  --bg: #ECEDF1;           /* cool studio grey, biased to the brand blue */
  --surface: #FFFFFF;
  --surface-2: #F5F6F9;
  --line: #DADDE5;
  --line-2: #E7E9EF;
  --ink: #0B0C10;
  --ink-2: #464A56;
  --muted: #868B98;
  --accent: #2C5BFF;       /* Création Virale blue */
  --accent-2: #1E45DB;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(44, 91, 255, .10);
  --violet: #7C5CFF;
  --amber: #D98500;
  --amber-soft: rgba(217, 133, 0, .12);
  --green: #12A150;
  --green-soft: rgba(18, 161, 80, .12);
  --red: #E5484D;
  --stage: #0B0C10;        /* the player is always dark: video is judged on black */
  --stage-2: #16181F;
  --stage-line: #2A2D36;
  --stage-ink: #F2F3F6;
  --stage-muted: #8C91A0;
  --dots: rgba(11, 12, 16, .10);
  --shadow: 0 1px 2px rgba(11, 12, 16, .04), 0 8px 24px rgba(11, 12, 16, .06);
  --shadow-lg: 0 2px 6px rgba(11, 12, 16, .06), 0 24px 60px rgba(11, 12, 16, .14);
  --f-display: "Geist", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0D11; --surface: #14161C; --surface-2: #1A1D25; --line: #2A2E39; --line-2: #22252E;
    --ink: #F2F3F6; --ink-2: #BAC0CC; --muted: #7E8494; --accent: #4E78FF; --accent-2: #6B8DFF; --accent-ink: #FFFFFF;
    --accent-soft: rgba(78, 120, 255, .16); --violet: #9B84FF; --amber: #F0A23A; --amber-soft: rgba(240, 162, 58, .14);
    --green: #3CCB7F; --green-soft: rgba(60, 203, 127, .14); --red: #FF6B70;
    --stage: #07080B; --stage-2: #111319; --stage-line: #262933; --dots: rgba(255, 255, 255, .07);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0D11; --surface: #14161C; --surface-2: #1A1D25; --line: #2A2E39; --line-2: #22252E;
  --ink: #F2F3F6; --ink-2: #BAC0CC; --muted: #7E8494; --accent: #4E78FF; --accent-2: #6B8DFF; --accent-ink: #FFFFFF;
  --accent-soft: rgba(78, 120, 255, .16); --violet: #9B84FF; --amber: #F0A23A; --amber-soft: rgba(240, 162, 58, .14);
  --green: #3CCB7F; --green-soft: rgba(60, 203, 127, .14); --red: #FF6B70;
  --stage: #07080B; --stage-2: #111319; --stage-line: #262933; --dots: rgba(255, 255, 255, .07);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- studio bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-2); }
.bar-in { max-width: 1480px; margin: 0 auto; padding-block: 12px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.brand svg { width: 30px; height: 30px; flex: none; color: var(--ink); }
.brand b { display: block; font: 800 14px/1.1 var(--f-display); letter-spacing: .02em; }
.brand span { display: block; font: 500 10px/1.4 var(--f-mono); letter-spacing: .26em; color: var(--muted); text-transform: uppercase; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 13px; }
.crumbs button { background: none; border: 0; padding: 4px 6px; border-radius: 8px; color: var(--ink-2); }
.crumbs button:hover { background: var(--surface); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.live { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font: 500 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.live[data-s="on"] i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.live[data-s="queue"] i { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 0; }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------- shared ---------- */
.wrap { max-width: 1480px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: scale(.98); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.open { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
.pill.prog { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 35%, transparent); background: var(--amber-soft); }
.pill.check { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 35%, transparent); background: color-mix(in srgb, var(--violet) 12%, transparent); }
.pill.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); background: var(--green-soft); }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.dotted { background-color: var(--surface-2); background-image: radial-gradient(var(--dots) 1px, transparent 1.2px); background-size: 14px 14px; }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty b { color: var(--ink); font: 700 17px/1.3 var(--f-display); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home ---------- */
.home { padding-block: 64px 80px; display: grid; gap: 56px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.hero h1 { font: 800 clamp(44px, 7.2vw, 96px)/.92 var(--f-display); letter-spacing: -.055em; }
.hero h1 em { font-style: normal; color: var(--accent); display: block; }
.hero p { margin-top: 26px; max-width: 54ch; color: var(--ink-2); font-size: 16.5px; }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.flow div { padding: 20px 18px; display: grid; gap: 6px; align-content: start; }
.flow div + div { border-left: 1px solid var(--line-2); }
.flow .n { font: 500 11px/1 var(--f-mono); color: var(--accent); letter-spacing: .1em; }
.flow b { font: 700 15px/1.2 var(--f-display); }
.flow span { color: var(--muted); font-size: 13px; line-height: 1.4; }
.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.door { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; text-align: left; padding: 26px; min-height: 220px; border-radius: 26px; border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.door:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--line); }
.door h2 { font: 800 clamp(28px, 3.2vw, 40px)/.98 var(--f-display); letter-spacing: -.045em; }
.door p { margin-top: 10px; color: var(--ink-2); max-width: 40ch; font-size: 14.5px; }
.door .go { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; transition: transform .25s ease; }
.door:hover .go { transform: rotate(-45deg); }
.door .go svg { width: 22px; height: 22px; }
.door.blue { background: var(--accent); border-color: var(--accent); color: #fff; }
.door.blue p { color: rgba(255, 255, 255, .82); }
.door.blue .go { background: #fff; color: var(--accent); }
.door .eyebrow { margin-bottom: 16px; }
.door.blue .eyebrow { color: rgba(255, 255, 255, .7); }
.door-art { position: absolute; right: 26px; top: 22px; display: flex; gap: 6px; opacity: .95; pointer-events: none; }
.door-art i { width: 22px; height: 38px; border-radius: 6px; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); }
.door-art i:nth-child(2) { background: rgba(255, 255, 255, .34); transform: translateY(-6px); }
.door-art i:nth-child(3) { background: #fff; transform: translateY(-12px); }
.door-tl { position: absolute; right: 26px; top: 26px; width: min(46%, 260px); display: grid; gap: 7px; pointer-events: none; }
.door-tl .t { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; }
.door-tl .t i { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.sec-h h2 { font: 700 22px/1.2 var(--f-display); letter-spacing: -.025em; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.pcard { display: grid; text-align: left; padding: 0; overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
.pcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.pcard .art { height: 260px; display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; overflow: hidden; }
.pcard .art img { height: 210px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; box-shadow: 0 14px 30px rgba(11, 12, 16, .22); transition: transform .3s ease; max-width: 100%; }
.pcard .art img:nth-child(1) { transform: rotate(-7deg) translateY(10px) scale(.86); opacity: .75; }
.pcard .art img:nth-child(3) { transform: rotate(7deg) translateY(10px) scale(.86); opacity: .75; }
.pcard:hover .art img:nth-child(1) { transform: rotate(-10deg) translate(-10px, 8px) scale(.88); }
.pcard:hover .art img:nth-child(3) { transform: rotate(10deg) translate(10px, 8px) scale(.88); }
.pcard .meta { padding: 16px 18px 18px; display: grid; gap: 10px; border-top: 1px solid var(--line-2); }
.pcard .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pcard h3 { font: 700 18px/1.2 var(--f-display); letter-spacing: -.02em; }
.vchips { display: flex; gap: 4px; flex-wrap: wrap; }
.vchips span { font: 500 11px/1 var(--f-mono); padding: 5px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.vchips span.cur { background: var(--ink); color: var(--bg); }
.stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 600; }
.inflight { display: grid; gap: 10px; }
.req-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-2); text-align: left; }
.req-row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.req-row .ic svg { width: 18px; height: 18px; }
.req-row b { font-weight: 600; }
.req-row small { display: block; color: var(--muted); font-size: 12.5px; }

/* ---------- review ---------- */
.review { padding-block: 18px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; align-items: start; }
.vbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.vsel { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); gap: 2px; }
.vsel button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 9px; font: 600 13px/1 var(--f-body); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
.vsel button small { font: 500 10.5px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.vsel button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.vsel button[aria-pressed="true"] small { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.vbar .grow { flex: 1; }
.stage { position: relative; background: var(--stage); border-radius: 24px; overflow: hidden; color: var(--stage-ink); box-shadow: var(--shadow-lg); }
.stage-in { position: relative; height: clamp(420px, 68vh, 860px); display: flex; align-items: center; justify-content: center; gap: 18px; padding: 18px 72px; }
.screen { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--stage-line), 0 30px 80px rgba(0, 0, 0, .55); }
.screen video, .screen img.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.screen canvas.drawable { cursor: crosshair; }
.screen .tag { position: absolute; left: 10px; top: 10px; z-index: 3; font: 600 11px/1 var(--f-mono); letter-spacing: .08em; padding: 6px 8px; border-radius: 7px; background: rgba(0, 0, 0, .55); color: #fff; backdrop-filter: blur(6px); }
.screen .bigplay { position: absolute; inset: 0; margin: auto; width: 74px; height: 74px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .92); color: #0B0C10; display: grid; place-items: center; z-index: 2; box-shadow: 0 16px 40px rgba(0, 0, 0, .45); transition: transform .15s ease, opacity .2s ease; }
.screen .bigplay:hover { transform: scale(1.06); }
.screen .bigplay svg { width: 28px; height: 28px; margin-left: 4px; }
.tools { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; padding: 7px; border-radius: 16px; background: var(--stage-2); border: 1px solid var(--stage-line); z-index: 4; }
.tools button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: transparent; color: var(--stage-muted); display: grid; place-items: center; position: relative; }
.tools button:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.tools button[aria-pressed="true"] { background: #fff; color: #0B0C10; }
.tools button svg { width: 18px; height: 18px; }
.tools hr { border: 0; height: 1px; background: var(--stage-line); margin: 3px 4px; }
.tools .sw { width: 38px; height: 22px; }
.tools .sw i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); }
.tools .sw[aria-pressed="true"] { background: transparent; }
.tools .sw[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--stage-2), 0 0 0 4px #fff; }
.tools button:disabled { opacity: .3; cursor: not-allowed; }
.stage-hint { position: absolute; right: 16px; top: 16px; z-index: 4; font: 500 11px/1.4 var(--f-mono); color: var(--stage-muted); letter-spacing: .06em; text-align: right; }
.stage-hint kbd { font: inherit; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--stage-line); color: var(--stage-ink); }
.transport { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--stage-line); background: var(--stage-2); flex-wrap: wrap; }
.transport button { height: 34px; min-width: 34px; padding: 0 8px; border-radius: 9px; border: 0; background: transparent; color: var(--stage-ink); display: inline-grid; place-items: center; font: 600 12px/1 var(--f-mono); }
.transport button:hover { background: rgba(255, 255, 255, .07); }
.transport button svg { width: 17px; height: 17px; }
.transport .play { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #0B0C10; }
.transport .play:hover { background: #fff; transform: scale(1.04); }
.tc { display: flex; align-items: baseline; gap: 10px; margin: 0 8px; font: 500 13px/1 var(--f-mono); color: var(--stage-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc b { color: #fff; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.tc span { padding: 4px 7px; border-radius: 6px; background: rgba(255, 255, 255, .06); }

.timeline { position: relative; padding: 10px 14px 14px; background: var(--stage-2); user-select: none; -webkit-user-select: none; touch-action: none; }
.chapters { position: relative; height: 22px; margin-bottom: 6px; }
.chapters button { position: absolute; top: 0; height: 22px; border: 0; border-radius: 6px; padding: 0 7px; font: 500 10.5px/22px var(--f-mono); letter-spacing: .05em; color: var(--stage-ink); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(255, 255, 255, .06); border-left: 2px solid var(--c, #4E78FF); }
.chapters button:hover { background: rgba(255, 255, 255, .12); }
.chapters button.cur { background: rgba(255, 255, 255, .14); }
.track { position: relative; height: 60px; border-radius: 10px; overflow: hidden; background: #000; cursor: pointer; }
.track canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ruler { position: relative; height: 18px; margin-top: 4px; }
.ruler canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pins { position: absolute; left: 14px; right: 14px; top: 34px; height: 60px; pointer-events: none; }
.pin { position: absolute; top: -9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); border: 2px solid var(--stage-2); background: var(--accent); pointer-events: auto; cursor: pointer; padding: 0; box-shadow: 0 4px 10px rgba(0, 0, 0, .4); }
.pin.prog { background: var(--amber); } .pin.check { background: var(--violet); } .pin.done { background: var(--green); opacity: .7; }
.pin.sel { box-shadow: 0 0 0 3px #fff, 0 4px 10px rgba(0, 0, 0, .4); }
.pin.draft { background: #fff; }
.head { position: absolute; top: 34px; width: 2px; height: 82px; margin-left: -1px; background: #fff; pointer-events: none; box-shadow: 0 0 10px rgba(255, 255, 255, .6); }
.head::before { content: ""; position: absolute; top: -6px; left: -6px; width: 14px; height: 14px; border-radius: 4px; background: #fff; }
.hover-thumb { position: absolute; bottom: 104px; width: 100px; padding: 4px; border-radius: 10px; background: #fff; box-shadow: 0 14px 34px rgba(0, 0, 0, .5); pointer-events: none; transform: translateX(-50%); z-index: 6; }
.hover-thumb canvas { display: block; width: 92px; height: 164px; border-radius: 7px; }
.hover-thumb div { font: 600 11px/1 var(--f-mono); color: #0B0C10; text-align: center; padding: 6px 0 2px; font-variant-numeric: tabular-nums; }
.compare .stage-in { gap: 22px; padding-left: 22px; padding-right: 22px; }
.compare .screen { height: 100%; }
.side { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; justify-items: center; }
.side select { background: var(--stage-2); color: #fff; border: 1px solid var(--stage-line); border-radius: 9px; height: 32px; padding: 0 10px; font: 600 12px/1 var(--f-mono); }
.side .lbl { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; color: var(--stage-muted); display: flex; gap: 10px; align-items: center; }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: grid; gap: 12px; max-height: calc(100vh - 92px); grid-template-rows: auto auto minmax(0, 1fr) auto; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.tabs button { flex: 1; height: 34px; border: 0; background: none; border-radius: 9px; font: 600 13px/1 var(--f-body); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button small { font: 500 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs button[aria-selected="true"] small { background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); }
.composer { padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); display: grid; gap: 10px; }
.composer .at { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 12px/1 var(--f-mono); color: var(--ink-2); }

.composer .at .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); line-height: 1.45; font-size: 14.5px; }
.composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.composer .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.composer .row small { color: var(--muted); font-size: 12px; }
.composer.locked { opacity: .9; }
.composer .lock { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13.5px; }
.composer .lock svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { overflow: auto; display: grid; gap: 10px; align-content: start; padding: 2px 2px 4px; min-height: 120px; }
.cm { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-2); text-align: left; transition: border-color .15s ease, box-shadow .15s ease; }
.cm:hover { border-color: var(--line); }
.cm.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cm .th { width: 64px; aspect-ratio: 9 / 16; border-radius: 8px; background: var(--stage) center / cover no-repeat; position: relative; overflow: hidden; }
.cm .th span { position: absolute; left: 4px; bottom: 4px; font: 600 9.5px/1 var(--f-mono); color: #fff; background: rgba(0, 0, 0, .6); padding: 3px 4px; border-radius: 4px; }
.cm .bd { display: grid; gap: 7px; min-width: 0; align-content: start; }
.cm .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cm .tcode { font: 600 12px/1 var(--f-mono); color: var(--accent); background: none; border: 0; padding: 0; font-variant-numeric: tabular-nums; }
.cm .txt { font-size: 14px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; }
.cm .note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; display: flex; gap: 7px; }

.cm .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.cm .acts button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.cm .acts button:hover { color: var(--ink); border-color: var(--ink-2); }
.cm .acts button.ok { background: var(--green); border-color: var(--green); color: #fff; }
.cm .acts button.del { margin-left: auto; color: var(--red); border-color: transparent; background: none; }
.send { padding: 14px; border-radius: var(--r-md); background: var(--ink); color: var(--bg); display: grid; gap: 10px; }
.send .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.send b { font: 700 15px/1.2 var(--f-display); }
.send small { display: block; opacity: .65; font-size: 12.5px; margin-top: 2px; }
.send .btn.primary { height: 42px; }
.req { padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-2); display: grid; gap: 12px; }
.req .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.req h4 { margin: 0; font: 700 15px/1.25 var(--f-display); }
.req small { color: var(--muted); font-size: 12.5px; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.steps div { display: grid; gap: 6px; }
.steps i { height: 4px; border-radius: 2px; background: var(--line); }
.steps span { font: 500 9.5px/1.2 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.steps .on i { background: var(--accent); } .steps .on span { color: var(--ink-2); }
.steps .now i { background: linear-gradient(90deg, var(--accent) 0 50%, var(--line) 50%); background-size: 200% 100%; animation: flowbar 1.2s linear infinite; }
@keyframes flowbar { from { background-position: 100% 0; } to { background-position: 0 0; } }
.pv { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.pv button { padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 9 / 16; background: var(--stage) center / cover; position: relative; }
.pv button span { position: absolute; left: 3px; bottom: 3px; font: 600 9px/1 var(--f-mono); color: #fff; background: rgba(0, 0, 0, .6); padding: 2px 4px; border-radius: 4px; }
.claude-note { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }
.claude-note svg { width: 18px; height: 18px; flex: none; color: var(--accent); margin-top: 1px; }
.notes { display: grid; gap: 14px; overflow: auto; align-content: start; }
.notes .blk { padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-2); display: grid; gap: 10px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); font-size: 14px; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.specs div { padding: 10px; border-radius: 10px; background: var(--surface-2); }
.specs b { display: block; font: 600 15px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.specs span { font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chlist { display: grid; gap: 2px; }
.chlist button { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 0; background: none; padding: 8px 6px; border-radius: 8px; text-align: left; font-size: 14px; }
.chlist button:hover { background: var(--surface-2); }
.chlist i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.chlist small { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* sheets (modal) */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 9, 13, .46); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(640px, 100%); max-height: min(86vh, 900px); overflow: auto; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--line-2); display: grid; }
.sheet header { padding: 22px 24px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: start; border-bottom: 1px solid var(--line-2); }
.sheet header h3 { font: 800 24px/1.1 var(--f-display); letter-spacing: -.03em; }
.sheet header p { color: var(--ink-2); margin-top: 6px; font-size: 14px; }
.sheet .body { padding: 18px 24px; display: grid; gap: 14px; }
.sheet footer { padding: 14px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.chk { display: grid; grid-template-columns: auto 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line-2); }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.chk .th { width: 48px; aspect-ratio: 9 / 16; border-radius: 6px; background: var(--stage) center / cover; }
.chk b { font: 600 12px/1 var(--f-mono); color: var(--accent); }
.chk p { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
.field { display: grid; gap: 7px; }
.field label { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-size: 14.5px; }
.field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.copybox { font: 500 12.5px/1.5 var(--f-mono); white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 220px; overflow: auto; overflow-wrap: anywhere; }

/* ---------- create (brief builder) ---------- */
.create { padding-block: 26px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
.create-h h1 { font: 800 clamp(36px, 5vw, 64px)/.95 var(--f-display); letter-spacing: -.05em; }
.create-h h1 em { font-style: normal; color: var(--accent); }
.create-h p { margin-top: 14px; color: var(--ink-2); max-width: 60ch; }
.bsec { display: grid; gap: 16px; padding: 24px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.bsec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bsec h2 { font: 700 20px/1.2 var(--f-display); letter-spacing: -.02em; display: flex; align-items: baseline; gap: 12px; }
.bsec h2 .n { font: 500 12px/1 var(--f-mono); color: var(--accent); letter-spacing: .08em; }
.bsec header small { color: var(--muted); font-size: 13px; }
.builder { display: grid; gap: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 178px), 1fr)); gap: 12px; }
.tile { position: relative; display: grid; gap: 0; padding: 0; text-align: left; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.tile:hover { transform: translateY(-2px); border-color: var(--ink-2); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile .tag { position: absolute; top: 8px; right: 8px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: none; place-items: center; font: 700 11px/1 var(--f-mono); }
.tile[aria-pressed="true"] .tag { display: grid; }
.tile .lab { padding: 10px 12px 12px; display: grid; gap: 3px; }
.tile .lab b { font: 700 14px/1.2 var(--f-display); }
.tile .lab span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile .ply { position: absolute; right: 10px; bottom: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.tile .ply svg { width: 13px; height: 13px; margin-left: 2px; }
.tile .ply.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fmt { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.fmt button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px 10px; display: grid; justify-items: center; gap: 10px; }
.fmt button i { display: block; border-radius: 5px; background: var(--surface-2); border: 2px solid var(--ink-2); height: 58px; max-width: 100%; }
.fmt button b { font: 600 12px/1 var(--f-mono); }
.fmt button small { font-size: 11px; color: var(--muted); }
.fmt button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fmt button[aria-pressed="true"] i { border-color: var(--accent); background: var(--accent-soft); }
.energy { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.energy button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: left; }
.energy button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.energy .bars { height: 34px; display: flex; align-items: end; gap: 3px; }
.energy .bars i { flex: 1; height: 100%; background: var(--accent); border-radius: 2px; transform-origin: 50% 100%; animation: eq var(--d, 1s) ease-in-out infinite alternate; }
@keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
.energy b { font: 700 15px/1 var(--f-display); }
.energy small { font: 500 11px/1.3 var(--f-mono); color: var(--muted); }
.beats-list { display: grid; gap: 8px; }
.beat-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 6px 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.beat-row .ix { font: 600 12px/1 var(--f-mono); color: var(--accent); }
.beat-row input { border: 0; background: none; padding: 8px 4px; min-width: 0; font-size: 14.5px; }
.beat-row input:focus { outline: none; }
.beat-row .mv { display: flex; gap: 2px; }
.beat-row .mv button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.beat-row .mv button:hover { background: var(--surface); color: var(--ink); }
.beat-row .mv svg { width: 14px; height: 14px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.uploads { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.uploads .up { width: 64px; height: 64px; border-radius: 12px; background: var(--stage) center / cover; position: relative; }
.uploads .up button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; padding: 0; font-size: 13px; line-height: 1; }
.uploads label.drop { width: 64px; height: 64px; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer; }
.uploads label.drop:hover { border-color: var(--accent); color: var(--accent); }
.uploads label.drop svg { width: 22px; height: 22px; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.colors .c { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.colors .c input { position: absolute; inset: -8px; width: 60px; height: 60px; border: 0; padding: 0; cursor: pointer; background: none; }
.colors .c button { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .55); color: #fff; font-size: 10px; line-height: 16px; padding: 0; display: none; }
.colors .c:hover button { display: block; }
.colors .add { width: 44px; height: 44px; border-radius: 12px; border: 1.5px dashed var(--line); background: none; color: var(--muted); font-size: 20px; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: grid; gap: 14px; }
.summary .card { padding: 20px; display: grid; gap: 14px; }
.summary h3 { font: 700 18px/1.2 var(--f-display); }
.brief-out { font: 500 12.5px/1.6 var(--f-mono); white-space: pre-wrap; color: var(--ink-2); background: var(--surface-2); border-radius: 14px; padding: 14px; max-height: 46vh; overflow: auto; overflow-wrap: anywhere; border: 1px solid var(--line-2); }
.brief-out b { color: var(--ink); font-weight: 600; }
.meter { display: grid; gap: 6px; }
.meter .t { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter .t i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
.meter small { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

/* style previews: each tile animates its own style, CSS only */
.sp { position: relative; height: 112px; overflow: hidden; background: #0E1016; }
.sp * { position: absolute; }
.sp-apple { background: linear-gradient(180deg, #F7F7F9, #E8EAEF); }
.sp-apple .a1 { left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 18px; background: linear-gradient(145deg, #fff, #dfe3ea); box-shadow: 0 18px 30px rgba(0, 0, 0, .18); animation: apple 4s cubic-bezier(.16, 1, .3, 1) infinite; }
.sp-apple .a2 { left: 0; right: 0; bottom: 12px; text-align: center; font: 600 11px/1 var(--f-display); color: #111; letter-spacing: -.01em; animation: fadeup 4s cubic-bezier(.16, 1, .3, 1) infinite; }
@keyframes apple { 0% { transform: scale(.7) translateY(16px); opacity: 0; } 25%, 80% { transform: scale(1) translateY(-6px); opacity: 1; } 100% { transform: scale(1.04) translateY(-6px); opacity: 0; } }
@keyframes fadeup { 0%, 30% { opacity: 0; transform: translateY(8px); } 45%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.sp-kinetic { background: #0B0C10; }
.sp-kinetic span { left: 0; right: 0; top: 50%; margin-top: -18px; text-align: center; font: 800 30px/36px var(--f-display); letter-spacing: -.05em; color: #fff; opacity: 0; animation: slam 2.4s cubic-bezier(.16, 1, .3, 1) infinite; }
.sp-kinetic span:nth-child(2) { animation-delay: -1.8s; color: #4E78FF; }
.sp-kinetic span:nth-child(3) { animation-delay: -1.2s; }
.sp-kinetic span:nth-child(4) { animation-delay: -.6s; color: #FF3D8B; }
@keyframes slam { 0% { opacity: 0; transform: scale(1.8); letter-spacing: .2em; } 4% { opacity: 1; transform: scale(1); letter-spacing: -.05em; } 24.5% { opacity: 1; transform: scale(.96); } 25%, 100% { opacity: 0; transform: scale(.8); } }
.sp-glass { background: radial-gradient(circle at 25% 30%, #6A8CFF, transparent 45%), radial-gradient(circle at 80% 70%, #FF6FA8, transparent 45%), #1A1240; }

/* ---------- capabilities ---------- */
const CAP = { db: null, assets: null, comments: null, downloads: null, user: null };
const use = async (name) => { try { return window.claude?.use ? await window.claude.use(name) : null; } catch { return null; } };

/* ---------- live state ---------- */
const ST = {
  booted: false,
  projects: [],
  versions: {}, comments: {}, requests: {},       // pid -> [ {id, ...data} ]
  styles: [],                                       // the style library: saved recipes
  subs: {},                                         // pid -> [unsubscribe]
  route: { view: "home", pid: null, vid: null },
  claude: "unknown",                                // canSendToClaude snapshot
  canWrite: true,
};
const rows = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
const P = (pid) => ST.projects.find((p) => p.id === pid);
const versionsOf = (pid) => ST.versions[pid] || [];
const commentsOf = (pid) => ST.comments[pid] || [];
const requestsOf = (pid) => ST.requests[pid] || [];
const latestVersion = (pid) => { const v = versionsOf(pid); return v.length ? v[v.length - 1] : null; };

function subscribeProject(pid) {
  if (ST.subs[pid] || !CAP.db) return;
  const base = `projects/${pid}`;
  const onErr = (e) => console.warn("db", e?.code, e?.message);
  ST.subs[pid] = [
    CAP.db.collection(`${base}/versions`).orderBy("n").onSnapshot((s) => { ST.versions[pid] = rows(s); changed("versions", pid); }, onErr),
    CAP.db.collection(`${base}/comments`).orderBy("t").onSnapshot((s) => { ST.comments[pid] = rows(s); changed("comments", pid); }, onErr),
    CAP.db.collection(`${base}/requests`).orderBy("createdAt", "desc").onSnapshot((s) => { ST.requests[pid] = rows(s); changed("requests", pid); }, onErr),
  ];
}
function startData() {
  if (!CAP.db) { changed("projects"); return; }
  CAP.db.collection("projects").orderBy("updatedAt", "desc").limit(20).onSnapshot((s) => {
    ST.projects = rows(s);
    ST.projects.forEach((p) => subscribeProject(p.id));
    ST.booted = true;
    changed("projects");
  }, (e) => { console.warn("db projects", e?.code); ST.booted = true; changed("projects"); });
  CAP.db.collection("styles").orderBy("createdAt", "desc").limit(40).onSnapshot((s) => { ST.styles = rows(s); changed("styles"); },
    (e) => console.warn("db styles", e?.code));
}

/* writes: one at a time per document, only on a viewer action */
const dbw = {
  set: (path, data) => CAP.db.doc(path).set(data),
  update: (path, data) => CAP.db.doc(path).update(data),
  del: (path) => CAP.db.doc(path).delete(),
};
async function touchProject(pid) { try { await dbw.update(`projects/${pid}`, { updatedAt: now() }); } catch {} }

/* ---------- Claude bridge: a page-written comment thread that wakes the Claude session ---------- */
async function refreshClaude() {
  let s = "off";
  try { if (CAP.comments?.canSendToClaude) s = await CAP.comments.canSendToClaude(); } catch { s = "off"; }
  ST.claude = s;
  const el = $("#live");
  if (el) {
    const on = s === "available";
    el.dataset.s = !CAP.db ? "off" : on ? "on" : "queue";
    el.innerHTML = `<i></i><b>${!CAP.db ? "Preview mode" : on ? "Claude listening" : "Requests queue"}</b>`;
    el.title = !CAP.db ? "Open this page on claude.ai to sync comments and versions."
      : on ? "Requests you send wake the Claude session right away."
      : "No Claude session is listening right now. Requests are saved and picked up when you tell Claude to check the studio.";
  }
  return s;
}
/** Post `text` as a comment thread anchored at `el` and send it to Claude. Resolves the thread id, or null. */
async function notifyClaude(text, el) {
  try {
    if (!CAP.comments?.sendToClaude) return null;
    const s = await CAP.comments.canSendToClaude();
    if (s !== "available") return null;
    const anchor = await CAP.comments.anchorFor(el);
    const r = await CAP.comments.sendToClaude({ anchor, text: text.slice(0, 3900) });
    return r?.threadId || "sent";
  } catch (e) { console.warn("sendToClaude", e?.code, e?.message); return null; }
}

/* ---------- toast, sheet ---------- */
let toastT;
function toast(msg) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
}
function sheet({ title, sub = "", body = "", foot = "", onMount, wide = false }) {
  closeSheet();
  const s = document.createElement("div");
  s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" style="${wide ? "width:min(860px,100%)" : ""}">
    <header><div><h3 id="sheet-t">${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></header>
    <div class="body">${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</div>`;
  document.body.appendChild(s);
  s.addEventListener("click", (e) => { if (e.target === s || e.target.closest("[data-close]")) closeSheet(); });
  onMount?.(s);
  setTimeout(() => (s.querySelector("textarea, input, button.primary") || s.querySelector("button"))?.focus(), 30);
  return s;
}
function closeSheet() { $("#scrim")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#scrim")) { closeSheet(); e.stopPropagation(); } }, true);

async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected: press Ctrl/Cmd+C"); } }
}
function fallbackSheet(text, what) {
  sheet({
    title: `${what} saved`,
    sub: "No Claude session is listening right now, so it is waiting in the studio. Open your Claude Code session and paste this (or just say “check Motion Studio”).",
    body: `<div class="copybox" id="cpbox">${esc(text)}</div>`,
    foot: `<button class="btn" data-close>Close</button><button class="btn primary" id="cpbtn">Copy message</button>`,
    onMount: (s) => $("#cpbtn", s).addEventListener("click", () => copyText(text, $("#cpbox", s))),
  });
}

/* ---------- routing (bare #token deep links: #home, #create, #p.<pid>.<vid>) ---------- */
const VIEWS = {};
let viewKey = "";
function go(route, push = true) {
  ST.route = { view: "home", pid: null, vid: null, ...route };
  const key = `${ST.route.view}|${ST.route.pid}|${ST.route.vid}`;
  if (push) { try { history.replaceState(null, "", "#" + (ST.route.view === "project" ? `p.${ST.route.pid}${ST.route.vid ? "." + ST.route.vid : ""}` : ST.route.view)); } catch {} }
  if (key !== viewKey) {
    VIEWS[viewKey.split("|")[0]]?.leave?.();
    viewKey = key;
    window.scrollTo(0, 0);
    renderBar();
    VIEWS[ST.route.view]?.enter(ST.route);
  }
}
function routeFromHash() {
  const h = (location.hash || "").slice(1);
  if (h === "create") return { view: "create" };
  if (h.startsWith("p.")) { const [, pid, vid] = h.split("."); return { view: "project", pid, vid: vid || null }; }
  return { view: "home" };
}
function changed(kind, pid) {
  VIEWS[ST.route.view]?.update?.(kind, pid);
  if (kind === "projects") renderBar();
}

/* ---------- studio bar ---------- */
function renderBar() {
  const r = ST.route, p = r.pid && P(r.pid);
  const crumbs = r.view === "home" ? "" :
    `<span class="sep">/</span>${r.view === "create" ? `<span class="here">New video</span>` : `<span class="here">${esc(p?.name || "Project")}</span>`}`;
  $("#bar").innerHTML = `<div class="bar-in">
    <button class="brand" id="toHome" aria-label="Motion Studio home">${LOGO}<div><b>CRÉATION VIRALE</b><span>Motion Studio</span></div></button>
    <nav class="crumbs" aria-label="Breadcrumb">${r.view === "home" ? "" : `<button id="crHome" class="hide-s">Studio</button>`}${crumbs}</nav>
    <div class="bar-right">
      <span class="live" id="live" data-s="off"><i></i><b>Connecting</b></span>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">${ICON.sun}</button>
    </div></div>`;
  $("#toHome").onclick = () => go({ view: "home" });
  $("#crHome") && ($("#crHome").onclick = () => go({ view: "home" }));
  $("#themeBtn").onclick = toggleTheme;
  paintThemeBtn();
  refreshClaude();
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("cv-theme", next); } catch {}
  paintThemeBtn();
  VIEWS[ST.route.view]?.theme?.();
}
function paintThemeBtn() {
  const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const b = $("#themeBtn"); if (b) b.innerHTML = dark ? ICON.sun : ICON.moon;
}

/* ===================== tiny WebAudio synth: 2-bar genre sketches and sound-design palettes ===================== */
const SYNTH = (() => {
  let ac = null, out = null, live = [], endT = 0, onEnd = null, timer = 0;
  const ctx = () => {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      out = ac.createGain(); out.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      out.connect(comp); comp.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  };
  let noiseBuf = null;
  const noise = () => { if (!noiseBuf) { const n = ac.sampleRate; noiseBuf = ac.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); let s = 7; for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; } } return noiseBuf; };
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t, a, peak, d, sus = 0.0001) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + d); };
  const track = (n, stopAt) => { live.push(n); try { n.stop(stopAt); } catch {} };
  function osc(t, f, { type = "sine", dur = 0.3, gain = 0.2, a = 0.003, glide = null, cut = null, q = 1, pan = 0 } = {}) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    let node = o;
    if (cut) { const fl = ac.createBiquadFilter(); fl.type = "lowpass"; fl.Q.value = q; if (Array.isArray(cut)) { fl.frequency.setValueAtTime(cut[0], t); fl.frequency.exponentialRampToValueAtTime(cut[1], t + dur); } else fl.frequency.value = cut; o.connect(fl); node = fl; }
    const p = ac.createStereoPanner ? ac.createStereoPanner() : null; if (p) p.pan.value = pan;
    node.connect(g); (p ? (g.connect(p), p) : g).connect(out);
    env(g, t, a, gain, dur); o.start(t); track(o, t + dur + 0.05);
  }
  function nz(t, { dur = 0.1, gain = 0.2, type = "highpass", f = 6000, q = 0.8, to = null, pan = 0 } = {}) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q; if (to) fl.frequency.exponentialRampToValueAtTime(to, t + dur);
    const p = ac.createStereoPanner ? ac.createStereoPanner() : null; if (p) p.pan.value = pan;
    s.connect(fl); fl.connect(g); (p ? (g.connect(p), p) : g).connect(out);
    env(g, t, 0.002, gain, dur); s.start(t, Math.random() * 0.5); track(s, t + dur + 0.05);
  }
  const kick = (t, v = 1, hard = false) => { osc(t, hard ? 190 : 150, { glide: 44, dur: 0.32, gain: 0.9 * v }); nz(t, { dur: 0.012, gain: 0.25 * v, f: 3000 }); };
  const snare = (t, v = 1) => { nz(t, { dur: 0.16, gain: 0.32 * v, type: "bandpass", f: 1900, q: 0.7 }); osc(t, 220, { glide: 160, dur: 0.08, gain: 0.18 * v }); };
  const clap = (t, v = 1) => { [0, 0.011, 0.022].forEach((d) => nz(t + d, { dur: 0.05, gain: 0.26 * v, type: "bandpass", f: 1400, q: 1.2 })); nz(t + 0.03, { dur: 0.16, gain: 0.12 * v, type: "bandpass", f: 1500 }); };
  const hat = (t, v = 1, open = false, pan = 0.2) => nz(t, { dur: open ? 0.16 : 0.035, gain: 0.12 * v, f: 8000, pan });
  const bass = (t, m, dur, { type = "sawtooth", cut = [2400, 220], gain = 0.3 } = {}) => { osc(t, midi(m), { type, dur, gain, cut, q: 6 }); osc(t, midi(m - 12), { dur, gain: gain * 0.7 }); };
  const chord = (t, ms, dur, { type = "sawtooth", cut = [3600, 500], gain = 0.07, a = 0.004 } = {}) => ms.forEach((m, i) => [-0.07, 0.07].forEach((det, k) => osc(t, midi(m + det), { type, dur, gain, cut, a, pan: k ? 0.3 : -0.3 })));
  const pad_ = (t, ms, dur, gain = 0.05) => ms.forEach((m) => [-0.1, 0.1].forEach((det, k) => osc(t, midi(m + det), { type: "sawtooth", dur, gain, a: dur * 0.35, cut: 1300, pan: k ? 0.4 : -0.4 })));
  const pluck = (t, m, gain = 0.12, pan = 0) => osc(t, midi(m), { type: "triangle", dur: 0.28, gain, cut: [4200, 600], pan });
  const bell = (t, m, gain = 0.1, pan = 0) => { osc(t, midi(m), { dur: 1.1, gain, pan }); osc(t, midi(m) * 2.76, { dur: 0.25, gain: gain * 0.35, pan }); };
  const keysC = (t, ms, dur, gain = 0.06) => ms.forEach((m) => { osc(t, midi(m), { dur, gain, type: "sine" }); osc(t, midi(m) * 2, { dur: dur * 0.4, gain: gain * 0.3 }); });

  const Fm = [53, 56, 60, 63], Db = [49, 53, 56, 60], Ab = [56, 60, 63, 67], Eb = [51, 55, 58, 62];
  // each genre plays two bars at its tempo
  const GENRE = {
    electrofunk: { bpm: 120, play(t, b) { const riff = [[0, 0], [0.75, 0], [1, 12], [1.5, 0], [2, 0], [2.5, 3], [2.75, 5], [3, 7], [3.5, 12], [3.75, 10]];
      for (let bar = 0; bar < 2; bar++) { const o = t + bar * 4 * b, root = bar ? 25 : 29;
        for (let i = 0; i < 4; i++) { kick(o + i * b); hat(o + (i + 0.5) * b, 1.2, true); if (i % 2) clap(o + i * b); }
        riff.forEach(([s, n]) => bass(o + s * b, root + n + 12, b * 0.22, { cut: [2600, 200] }));
        [0.5, 1.75, 2.5, 3.25].forEach((s) => chord(o + s * b, (bar ? Db : Fm).map((m) => m + 12), b * 0.35, { cut: [4200, 400], gain: 0.06 })); } } },
    techno: { bpm: 128, play(t, b) { for (let bar = 0; bar < 2; bar++) { const o = t + bar * 4 * b;
        for (let i = 0; i < 4; i++) { kick(o + i * b, 1, true); osc(o + (i + 0.5) * b, midi(29), { type: "sawtooth", dur: b * 0.4, gain: 0.12, cut: [600, 120], q: 4 }); for (let s = 0; s < 4; s++) hat(o + (i + s / 4) * b, s === 2 ? 1.3 : 0.6, s === 2, s % 2 ? 0.3 : -0.3); if (i % 2) clap(o + i * b, 0.7); }
        [0.75, 2.75].forEach((s) => chord(o + s * b, [65, 68, 72], b * 0.5, { type: "square", cut: [2600, 300], gain: 0.05 })); } } },

    minimal: (t) => { osc(t, 2100, { dur: 0.04, gain: 0.12 }); osc(t + 0.6, 2100, { dur: 0.04, gain: 0.1 }); osc(t + 1.2, midi(84), { dur: 0.6, gain: 0.08 }); },
  };
  function stop() { clearTimeout(timer); live.forEach((n) => { try { n.stop(); } catch {} }); live = []; const cb = onEnd; onEnd = null; cb?.(); }
  function run(fn, len, cb) {
    stop(); ctx();
    const t = ac.currentTime + 0.05; fn(t); endT = t + len; onEnd = cb;

  }

    music(id, cb) { const g = GENRE[id]; if (!g) return; const b = 60 / g.bpm; run((t) => g.play(t, b), 8 * b, cb); },
    sfx(id, cb) { const f = SFX[id]; if (!f) return; run(f, 2.2, cb); },
    stop,
    progress() { return ac ? clamp(1 - (endT - ac.currentTime) / 4, 0, 1) : 0; },
  };
})();

async function shotAction(pid, rid, a, i, btn) {
  const r = requestsOf(pid).find((x) => x.id === rid); if (!r) return;
  const path = `projects/${pid}/requests/${rid}`, p = P(pid);

  const st = a === "skip" ? "skipped" : "approved";

  btn.disabled = true;
  try { await dbw.update(path, { shots }); } catch { btn.disabled = false; return toast("Could not save"); }
  if (st === "skipped") return toast("Shot skipped");
  const credits = idx.reduce((n, k) => n + (+shots[k].credits || 0), 0);

function teardownStage() {

  R.ro?.disconnect();
  R.medias = []; R.media = null;
}
function mountStage(keepT = 0) {
  teardownStage();
  const st = $("#stage"); if (!st) return;
  const v = R.ver;
  st.classList.toggle("compare", !!R.compare);
  if (!v) {
    const reqs = requestsOf(R.pid).filter((r) => r.status !== "done");
    st.innerHTML = `<div class="stage-in" style="padding:24px"><div class="empty" style="color:var(--stage-muted)"><b style="color:#fff">${reqs.length ? "Claude is building the first preview" : "No version yet"}</b>

    R.mounted = "empty"; return;
  }
  R.kind = v.kind === "frames" ? "frames" : "video";
  R.fps = v.fps || 30; R.bpm = v.bpm || 120;
  R.frames = (v.frames || []).slice().sort((a, b) => a.t - b.t);
  R.dur = R.kind === "frames" ? Math.max(v.duration || 0, (R.frames.at(-1)?.t || 0) + 0.5) : (v.duration || 30);
  if (R.compare) st.innerHTML = compareHTML();
  else st.innerHTML = stageHTML(v);
  st.insertAdjacentHTML("beforeend", transportHTML() + timelineHTML());
  R.mounted = R.compare ? "compare" : R.kind;
  R.canvas = $("#ink"); R.ctx = R.canvas?.getContext("2d");
  if (R.compare) {
    R.medias = [$("#vidA"), $("#vidB")]; R.media = R.medias[0];
    $("#cmpA").onchange = (e) => { R.compare.a = e.target.value; mountStage(R.t); };
    $("#cmpB").onchange = (e) => { R.compare.b = e.target.value; mountStage(R.t); };
  } else if (R.kind === "video") {
    R.media = $("#vid"); R.medias = [R.media];
  } else {
    R.media = null; R.medias = [];
    R.fi = clamp(R.frames.findIndex((f) => f.t >= keepT - 1e-3), 0, R.frames.length - 1);
    showFrame(R.fi);
  }
  R.medias.forEach((m) => {
    m.muted = R.muted; m.playbackRate = R.speed;
    m.addEventListener("loadedmetadata", () => { if (m === R.media && isFinite(m.duration)) { R.dur = m.duration; drawTimeline(); renderChapters(); renderPins(); } if (keepT) m.currentTime = Math.min(keepT, (m.duration || R.dur) - 0.01); });
    m.addEventListener("play", () => { R.playing = true; paintPlay(); loop(); });
    m.addEventListener("pause", () => { if (m === R.media) { R.playing = false; paintPlay(); syncClock(); drawInk(); } });
    m.addEventListener("ended", () => { R.playing = false; paintPlay(); });
    m.addEventListener("seeked", () => { if (m === R.media) { syncClock(); drawInk(); } });
    m.addEventListener("loadeddata", () => { if (m !== R.media && !R.playing && Math.abs(m.currentTime - R.t) > 0.04) m.currentTime = R.t; });
  });
  bindStage();
  R.t = keepT || 0;
  // sprite for the timeline filmstrip
  R.sprite = null;
  const sv = R.compare ? versionsOf(R.pid).find((x) => x.id === R.compare.a) : v;
  if (R.kind === "frames") {

  } else if (sv?.spriteAssetId) {

}

/* ---------- time ---------- */
const frameOf = (t) => Math.round(t * R.fps);
const beatOf = (t) => (t * R.bpm) / 60;
function curT() { if (R.kind === "frames" && !R.compare) return R.frames[R.fi]?.t || 0; return R.media ? R.media.currentTime : R.t; }

async function commentAction(id, a, btn) {

async function requestAction(rid, a, btn) {

/* ---------- keyboard ---------- */
function onKey(e) {
  if (!R || $("#scrim")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select") return;
  const k = e.key;
  if (k === " " || k === "k") { e.preventDefault(); togglePlay(); }
  else if (k === "ArrowLeft") { e.preventDefault(); step(e.shiftKey ? "beat" : "frame", -1); }
  else if (k === "ArrowRight") { e.preventDefault(); step(e.shiftKey ? "beat" : "frame", 1); }
  else if (k === "Home") { e.preventDefault(); pause(); seek(0); }
  else if ((k === "z" || k === "Z") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undoMark(); }
  else if (!R.compare && (k === "p" || k === "a" || k === "r")) setTool({ p: "pen", a: "arrow", r: "rect" }[k]);
  else if (k === "c") { e.preventDefault(); R.tab = "comments"; renderRail(); pause(); $("#cmText")?.focus(); }
  else if (k === "Escape") { if (R.tool) { R.tool = null; paintTools(); } }
}

  bind() {

    on("[data-fmt]", "click", (e) => { CB.format = e.currentTarget.dataset.fmt; this.reRender(); });

    on("[data-style]", "click", (e) => {
      const id = e.currentTarget.dataset.style, i = CB.styles.indexOf(id);

    });
    on("[data-energy]", "click", (e) => { CB.energy = e.currentTarget.dataset.energy; this.reRender(); });
    const pick = (attr, key) => on(`[data-${attr}]`, "click", (e) => { if (e.target.closest(".ply")) return; CB[key] = e.currentTarget.dataset[attr]; this.reRender(); });
    pick("music", "music"); pick("sfx", "sfx");
    on("[data-music],[data-sfx]", "keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } });
    const player = (attr, kind) => on(`[data-${attr}]`, "click", (e) => {
      e.stopPropagation();
      const b = e.currentTarget, id = b.dataset[attr === "play-m" ? "playM" : "playS"], tile = b.closest(".tile");
      if (b.classList.contains("on")) { SYNTH.stop(); return; }
      $$(".ply.on").forEach((x) => { x.classList.remove("on"); x.innerHTML = ICON.play; x.closest(".tile")?.classList.remove("playing"); });
      try {
        SYNTH[kind](id, () => { b.classList.remove("on"); b.innerHTML = ICON.play; tile.classList.remove("playing"); });
        b.classList.add("on"); b.innerHTML = ICON.pause; tile.classList.add("playing");

    player("play-m", "music"); player("play-s", "sfx");

    on("[data-rmb]", "click", (e) => { CB.beats.splice(+e.currentTarget.dataset.rmb, 1); this.reRender(); });
    $("#addBeat").onclick = () => { CB.beats.push(""); this.reRender(); setTimeout(() => $(`#beat${CB.beats.length - 1}`)?.focus(), 20); };

    on("[data-rmc]", "click", (e) => { CB.brand.colors.splice(+e.currentTarget.dataset.rmc, 1); this.reRender(); });

  reRender() { saveDraft(); const y = scrollY; SYNTH.stop(); this.render(); scrollTo(0, y); },
  async upload(files) {
    if (!CAP.assets) return toast("Uploads work when this page is open on claude.ai");

      if (f.size > 20 * 1024 * 1024) { toast(`${f.name} is over 20 MB`); continue; }
      try { toast(`Uploading ${f.name}…`); const a = await CAP.assets.upload(f); CB.images.push({ id: a.id, name: f.name, type: f.type }); }

  },

    return [
      ["PROJECT", `${CB.name || "Untitled"}${CB.client ? ` · ${CB.client}` : ""}`],
      ["SOURCE", src],
      ["FORMAT", `${CB.format} · ${CB.duration} s (${CB.duration * 2} beats at 120 BPM)`],
      ["STYLE", st],
      ["ENERGY", `${en.name} · ${en.d}`],
      ["HOOKS", CB.hooks.length ? `5 options from ${CB.hooks.map(hookName).join(", ")}` : "—"],
      ["MUSIC", `${mu.name} · ${mu.d}${CB.trend.on ? `\n  Trend-matched: original track styled on current trending sounds${CB.trend.link ? `\n  Reference: ${CB.trend.link}` : ""}` : ""}`],
      ["SOUND", `${sd.name} · ${sd.d}`],
      ["CAPTIONS", captionName(CB.captions)],
      ...(CB.shots.some((x) => x.prompt.trim()) ? [["AI SHOTS", CB.shots.filter((x) => x.prompt.trim()).map((x, i) => `\n  ${pad(i + 1)} [${x.kind === "image" ? "still" : "video"}] ${x.prompt.trim()}`).join("")]] : []),
      ...(CB.styleName ? [["LIBRARY", `Built from the saved style “${CB.styleName}”`]] : []),
      ["STORY", CB.beats.filter((b) => b.trim()).map((b, i) => `\n  ${pad(i + 1)} ${b}`).join("")],
      ["BRAND", `${CB.brand.colors.join(" ")} · ${CB.brand.font}${CB.brand.rules ? `\n  ${CB.brand.rules.replace(/\n/g, "\n  ")}` : ""}`],
      ...(CB.notes ? [["INCLUDE", CB.notes]] : []),
      ["DELIVERY", "5 hooks + 30 key frames → pick a hook, corrections → final render"],
    ];
  },
  paint() {
    const out = $("#briefOut"); if (!out) return;
    const s = this.summary();
    out.innerHTML = s.map(([k, v]) => `<b>${k.padEnd(9, " ")}</b>${esc(v)}`).join("\n");
    const checks = [!!CB.name.trim(), !!(CB.url || CB.images.length || CB.library || CB.shots.some((x) => x.prompt.trim())), CB.styles.length > 0, !!CB.music, !!CB.sfx, CB.beats.filter((b) => b.trim()).length >= 2, CB.brand.colors.length > 0, CB.hooks.length > 0];
    const pc = Math.round((checks.filter(Boolean).length / checks.length) * 100);
    const missing = [!checks[0] && "a name", !checks[1] && "a source", !checks[5] && "two story beats", !checks[7] && "a hook formula"].filter(Boolean);
    $("#meter").innerHTML = `<div class="t"><i style="width:${pc}%"></i></div><small><span>${pc === 100 ? "Ready to send" : `Add ${missing.join(", ") || "the rest"}`}</span><span class="num">${pc}%</span></small>`;
    $("#genBtn").disabled = !(checks[0] && checks[1] && checks[5] && checks[7]);
  },
  async generate(btn) {
    if (!CAP.db) return toast("Open this page on claude.ai to send the brief");
    btn.disabled = true;
    const slug = (CB.name || "video").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32) || "video";
    const pid = `${slug}-${Math.random().toString(36).slice(2, 6)}`, rid = newId("r");
    const summary = this.summary().map(([k, v]) => `${k}: ${v}`).join("\n");
    const text = `Motion Studio · NEW VIDEO BRIEF ${rid}\n${summary}\n\nBuild the film, then post 30 key frames as a “frames” version for review, and 5 alternative openings (first 2 s, 3–4 frames each) as hookOptions on this request. Quote every AI shot (model + credits) in shots[] and generate nothing until it is approved. Do not render the video until a hook is picked and the frames are approved.\nData: projects/${pid}/requests/${rid}`;
    const thread = await notifyClaude(text, btn);
    try {
      await dbw.set(`projects/${pid}`, { name: CB.name.trim(), client: CB.client.trim() || null, format: CB.format, duration: CB.duration, status: "briefing",
        brief: { ...JSON.parse(JSON.stringify(CB)), summary }, rules: [CB.brand.rules, "Never render the full video before the key frames are approved."].filter(Boolean).join("\n"),
        pipeline: PIPELINE, createdAt: now(), updatedAt: now() });
      const shots = CB.shots.filter((x) => x.prompt.trim()).map((x) => ({ id: newId("sh"), prompt: x.prompt.trim(), kind: x.kind || "video", status: "requested" }));
      await dbw.set(`projects/${pid}/requests/${rid}`, { type: "brief", status: "sent", versionLabel: "brief", createdAt: now(), hooks: CB.hooks.slice(), shots, notified: !!thread, threadId: thread && thread !== "sent" ? thread : null, text });
    } catch (e) { btn.disabled = false; return toast(e?.code === "invalid_argument" ? "You can view this studio but not create projects" : "Could not save the brief. Try again."); }
    try { localStorage.removeItem("cv-brief"); } catch {}
    VIEWS.project.pendingTab = "requests";
    go({ view: "project", pid });
    if (thread) toast("Brief sent to Claude"); else fallbackSheet(text, "Brief");
  },
};

/* ===================== boot ===================== */
(async function boot() {
  try { const th = localStorage.getItem("cv-theme"); document.documentElement.dataset.theme = th === "dark" ? "dark" : "light"; }
  catch { document.documentElement.dataset.theme = "light"; }
  go(routeFromHash(), false);
  addEventListener("hashchange", () => go(routeFromHash(), false));
  const [db, assets, comments, downloads, user] = await Promise.all(["db", "assets", "comments", "downloads", "user"].map(use));
  Object.assign(CAP, { db, assets, comments, downloads, user });
  try { const w = await user?.can?.("data.write"); ST.canWrite = w !== false; } catch {}
  startData();
  refreshClaude();
  addEventListener("focus", () => refreshClaude());
  setInterval(() => { if (document.visibilityState === "visible") refreshClaude(); }, 60000);
  if (!db) { changed("projects"); VIEWS[ST.route.view]?.update?.("projects"); }
})();

</script>
